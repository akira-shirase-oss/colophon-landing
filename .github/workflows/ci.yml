name: ci

on:
  push:
  pull_request:
  schedule:
    # Daily: new advisories appear without any code change.
    - cron: "23 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site:
    name: site (audit, lint, test, build, dist checks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Actions are pinned to full commit SHAs; Dependabot proposes updates weekly.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Workflow hygiene (pinned actions, read-only token, no script injection)
        run: node scripts/check-workflows.mjs
      - name: Install exactly what package-lock.json pins
        run: npm ci
      - name: Production dependencies have no moderate or worse advisories without a dated exception
        run: node scripts/audit.mjs
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Design tokens are a byte copy of colophon-cms at the pinned ref (D-210)
        # COLOPHON_REF matches scripts/tokens.test.mjs; moving both is the step that adopts a token change.
        env:
          COLOPHON_REF: 15b283db0391cff47fab8ac2d9fbf3d0e46b582a
        run: |
          set -euo pipefail
          curl -fsSL "https://raw.githubusercontent.com/akira-shirase-oss/colophon-cms/$COLOPHON_REF/design/tokens.css" -o "$RUNNER_TEMP/colophon-tokens.css"
          cmp -s "$RUNNER_TEMP/colophon-tokens.css" src/styles/tokens.css || {
            echo "src/styles/tokens.css differs from colophon-cms $COLOPHON_REF design/tokens.css: copy it again" >&2
            exit 1
          }
          grep -q "$COLOPHON_REF" scripts/tokens.test.mjs || { echo "scripts/tokens.test.mjs pins another ref" >&2; exit 1; }
          echo "a50494ed7ca60a21f2ffb7fd93bc996aaa7b5a2f0246184543ad0dfd5f557ed5  public/fonts/geist-pixel-latin.woff2" | sha256sum -c -
      - name: Contrast table (every text pair 4.5:1, every boundary 3:1, light and dark)
        run: node scripts/design-contrast.mjs
      - name: Build
        run: npm run build
      - name: Dist checks (headers and CSP, leaks, drafts, links, SEO, JSON-LD)
        # Optional repository secret: private names the leak scan must never find in dist/.
        env:
          LEAK_SCAN_NAMES: ${{ secrets.LEAK_SCAN_NAMES }}
        run: npm run check
